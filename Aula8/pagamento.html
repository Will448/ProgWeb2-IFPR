<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pagamento da Venda</title>
</head>
<body>

    <h1>Pagamento da Venda</h1>

    <form action="gerar_conta.php" method="POST">

        <label>Agência:</label><br>
        <input type="text" name="agencia" required><br><br>

        <label>Conta:</label><br>
        <input type="text" name="conta" required><br><br>

        <label>Nome do Cliente:</label><br>
        <input type="text" name="cliente" required><br><br>

        <label>Saldo Atual:</label><br>
        <input type="number" step="0.01" name="saldo" required><br><br>

        <label>Última Movimentação:</label><br>
        <input type="text" name="movimentacao" required><br><br>

        <button type="submit">Registrar Pagamento</button>

    </form>

</body>
</html>
